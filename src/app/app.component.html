<header class="app-header">
	<h1>Change Request Review</h1>
	<label>
		Acting as:
		<select (change)="switchUser($any($event.target).value)">
			<option *ngFor="let key of userKeys" [value]="key" [selected]="session.user.id === users[key]?.id">{{ key }}</option>
		</select>
	</label>
	<div class="app-demo-controls" aria-label="Demo network controls">
		<label>
			<input type="checkbox" [checked]="api.latencyMs > 0" (change)="setSlowNetwork($any($event.target).checked)" />
			Slow network
		</label>
		<button type="button" (click)="failNextRequest()" [disabled]="api.failNext">
			{{ api.failNext ? 'Next request will fail' : 'Fail next request' }}
		</button>
	</div>
</header>

<main class="app-layout" *ngIf="show">
	<app-cr-list (select)="onSelect($event)"></app-cr-list>
	<app-cr-detail *ngIf="selectedId" [id]="selectedId" (changed)="onCrChanged()"></app-cr-detail>
</main>
